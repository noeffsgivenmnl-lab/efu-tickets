HTML

<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>eTicket Scanner v1.0</title>

  <!-- CSS.html contents -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">

  <style>
    #qr-reader {
      width: 500px;
      box-sizing: border-box;
      margin: 0 auto;
    }

    @media only screen and (max-width: 600px) {
      #qr-reader {
        width: 100%;
      }
    }
  </style>
</head>

<body class="bg-dark text-light">
  <nav class="navbar sticky-top navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand mx-auto" href="#">
        <span><i class="bi bi-card-checklist"></i></span>eTicket Scanner v1.0
      </a>
    </div>
  </nav>

  <div class="container mt-4">
    <!-- Form.html contents -->
    <form id="InventoryForm" class="mt-3">
      <!-- QR Code Scanner / Upload Box -->
      <div class="card bg-secondary text-light mb-3">
        <div class="card-body">
          <h5 class="card-title mb-3">
            <i class="bi bi-qr-code-scan me-2"></i> Scan or Upload QR Code
          </h5>
          <!-- HTML5-QRCode Scanner & Upload Container -->
          <div id="qr-reader" style="width: 100%;"></div>
          <!-- Result Message Container -->
          <div id="qr-reader-results" class="mt-3"></div>
        </div>
      </div>

      <!-- Derived Product Code Input Field -->
      <div class="mb-3">
        <label for="productCode" class="form-label">Scanned eTicket Code</label>
        <input
          type="text"
          class="form-control bg-dark text-light border-secondary"
          id="productCode"
          name="productCode"
          placeholder="Code will appear here after scan/upload"
          required
        />
      </div>

      <!-- Action Buttons -->
      <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <button type="submit" id="submitBtn" class="btn btn-primary btn-lg me-md-2" disabled>
          <i class="bi bi-check-circle me-1"></i> Submit Verification
        </button>
        <button type="button" id="clearBtn" class="btn btn-outline-warning btn-lg" onclick="resetTransaction()">
          <i class="bi bi-arrow-counterclockwise me-1"></i> Clear for Next Transaction
        </button>
      </div>
    </form>
  </div>

  <!-- JavaScript.html contents (Modified for GitHub Fetch API instead of google.script.run) -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <script>
    // --- PASTE YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL HERE --- daemon
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZgwxunoHE9z497a-yBjmtrT0HzJW-efFsbkAS4qbD2uCONRIsm5eHLMsytoaPvlLq/exec";

    let html5QrcodeScanner;

    window.addEventListener("load", functionInit, true);

    function functionInit() {
      preventFormSubmit();
      initQrScanner();

      // Enable submit button as soon as user types in the input field
      document.getElementById("productCode").addEventListener("input", function() {
        document.getElementById("submitBtn").disabled = this.value.trim() === "";
      });
    }

    function preventFormSubmit() {
      const forms = document.querySelectorAll('form');
      forms.forEach(form => {
        form.addEventListener('submit', function(event) {
          event.preventDefault();
          handleFormSubmit(this);
        });
      });
    }

    function initQrScanner() {
      // Enable both camera scanning and file upload (album selection)
      html5QrcodeScanner = new Html5QrcodeScanner(
        "qr-reader",
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          supportedScanTypes: [
            Html5QrcodeScanType.SCAN_TYPE_CAMERA,
            Html5QrcodeScanType.SCAN_TYPE_FILE
          ]
        },
        false
      );

      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function onScanSuccess(decodedText, decodedResult) {
      const codeInput = document.getElementById("productCode");
      codeInput.value = decodedText;

      document.getElementById("submitBtn").disabled = false;
      const resultContainer = document.getElementById('qr-reader-results');
      resultContainer.innerHTML = `
        <div class="alert alert-info py-2 mb-0">
          <i class="bi bi-info-circle me-1"></i> Code <strong>${decodedText}</strong> detected. Click "Submit Verification" to proceed.
        </div>`;
    }

    function onScanFailure(error) {
      // Ignore frame-by-frame scanner errors
    }

    // Replaced google.script.run with fetch() for GitHub compatibility
    async function handleFormSubmit(formObject) {
      const submitBtn = document.getElementById("submitBtn");
      const resultContainer = document.getElementById('qr-reader-results');
      const codeValue = document.getElementById("productCode").value.trim();

      submitBtn.disabled = true;
      resultContainer.innerHTML = `
        <div class="alert alert-info py-2 mb-0">
          <span class="spinner-border spinner-border-sm me-2" role="status"></span> Verifying code with server...
        </div>`;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ productCode: codeValue })
        });

        const result = await response.json();
        onSuccess(result);

      } catch (error) {
        onFailure(error);
      }
    }

    function onSuccess(response) {
      const resultContainer = document.getElementById('qr-reader-results');

      if (response.status === "success") {
        resultContainer.innerHTML = `
          <div class="alert alert-success py-2 mb-0">
            <i class="bi bi-check-circle-fill me-1"></i> ${response.message}
          </div>`;
      } else {
        resultContainer.innerHTML = `
          <div class="alert alert-danger py-2 mb-0">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> ${response.message}
          </div>`;
      }
      document.getElementById("productCode").disabled = false;
      document.getElementById("submitBtn").disabled = true;
    }

    function onFailure(error) {
      const resultContainer = document.getElementById('qr-reader-results');
      resultContainer.innerHTML = `
        <div class="alert alert-danger py-2 mb-0">
          <i class="bi bi-x-circle-fill me-1"></i> Server Error: ${error.message}
        </div>`;
      document.getElementById("productCode").disabled = false;
      document.getElementById("submitBtn").disabled = true;
    }

    async function resetTransaction() {
      document.getElementById("InventoryForm").reset();
      document.getElementById("productCode").value = "";
      document.getElementById("qr-reader-results").innerHTML = "";
      document.getElementById("productCode").disabled = false;
      document.getElementById("submitBtn").disabled = true;

      if (html5QrcodeScanner) {
        try {
          await html5QrcodeScanner.clear();
        } catch (e) {
          console.warn("Scanner clear gracefully handled:", e);
        }
      }
      initQrScanner();
    }
  </script>
</body>
</html>
