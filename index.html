<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>eTicket Scanner</title>
  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #qr-reader { width: 100%; max-width: 500px; margin: 0 auto; box-sizing: border-box; }
  </style>
</head>
<body class="bg-dark text-light">
  <nav class="navbar sticky-top navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand mx-auto" href="#"><i class="bi bi-card-checklist"></i> eTicket Scanner v1.0</a>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="card bg-secondary text-light mb-3">
      <div class="card-body">
        <h5 class="card-title mb-3"><i class="bi bi-qr-code-scan me-2"></i> Scan QR Code</h5>
        <div id="qr-reader"></div>
        <div id="qr-reader-results" class="mt-3"></div>
      </div>
    </div>

    <form id="InventoryForm" onsubmit="handleFormSubmit(event)">
      <div class="mb-3">
        <label for="productCode" class="form-label">Scanned eTicket Code</label>
        <input type="text" class="form-control bg-dark text-light border-secondary" id="productCode" name="productCode" placeholder="Code will appear here after scan" required />
      </div>
      <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <button type="submit" id="submitBtn" class="btn btn-primary btn-lg me-md-2" disabled>
          <i class="bi bi-check-circle me-1"></i> Submit Verification
        </button>
        <button type="button" id="clearBtn" class="btn btn-outline-warning btn-lg" onclick="resetTransaction()">
          <i class="bi bi-arrow-counterclockwise me-1"></i> Clear
        </button>
      </div>
    </form>
  </div>

  <!-- html5-qrcode library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    // PASTE YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL HERE:
    const SCRIPT_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

    let html5QrcodeScanner;

    window.addEventListener("load", function() {
      initQrScanner();
      document.getElementById("productCode").addEventListener("input", function() {
        document.getElementById("submitBtn").disabled = this.value.trim() === "";
      });
    });

    function initQrScanner() {
      html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
      html5QrcodeScanner.render(onScanSuccess, () => {});
    }

    function onScanSuccess(decodedText) {
      const codeInput = document.getElementById("productCode");
      codeInput.value = decodedText;
      document.getElementById("submitBtn").disabled = false;
      document.getElementById('qr-reader-results').innerHTML = `
        <div class="alert alert-info py-2 mb-0">Code <strong>${decodedText}</strong> detected. Click Submit.</div>`;
    }

    async function handleFormSubmit(event) {
      event.preventDefault();
      const code = document.getElementById("productCode").value;
      const submitBtn = document.getElementById("submitBtn");
      const resultContainer = document.getElementById('qr-reader-results');

      submitBtn.disabled = true;
      resultContainer.innerHTML = `<div class="alert alert-info py-2 mb-0"><span class="spinner-border spinner-border-sm me-2"></span> Verifying...</div>`;

      try {
        // Fetch API request to Google Apps Script (Bypasses iframe restrictions entirely!)
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors", // Required for simple Google Script endpoint triggers
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ productCode: code })
        });

        // Note: Due to 'no-cors' opaque response boundaries, we query back or show success indication.
        // Alternatively, if you deploy a script web app text service, you can handle standard JSON if CORS allows.
        resultContainer.innerHTML = `<div class="alert alert-success py-2 mb-0"><i class="bi bi-check-circle-fill me-1"></i> Request sent and processed for ${code}! Check Sheet status.</div>`;
      } catch (error) {
        resultContainer.innerHTML = `<div class="alert alert-danger py-2 mb-0">Error: ${error.message}</div>`;
      }
    }

    async function resetTransaction() {
      document.getElementById("InventoryForm").reset();
      document.getElementById("productCode").value = "";
      document.getElementById("qr-reader-results").innerHTML = "";
      document.getElementById("submitBtn").disabled = true;
      if (html5QrcodeScanner) {
        try { await html5QrcodeScanner.clear(); } catch (e) {}
      }
      initQrScanner();
    }
  </script>
</body>
</html>
